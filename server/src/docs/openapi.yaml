        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - student_id
                - from_date
                - to_date
              properties:
                student_id:
                  type: integer
                class_id:
                  type: integer
                  nullable: true
                from_date:
                  type: string
                  example: '2026-10-20'
                to_date:
                  type: string
                  example: '2026-10-22'
                reason:
                  type: string
      responses:
        '201':
          description: Đã gửi
  /api/v1/parent/referral:
    get:
      tags:
        - ParentPortal
      summary: Mã giới thiệu + credit của phụ huynh
      responses:
        '200':
          description: OK
  /api/v1/parent/reviews:
    get:
      tags:
        - ParentPortal
      summary: Đánh giá của tôi
      responses:
        '200':
          description: OK
    post:
      tags:
        - ParentPortal
      summary: Gửi đánh giá (1-5 sao)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rating
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
                comment:
                  type: string
      responses:
        '201':
          description: Đã gửi (chờ duyệt)
  /api/v1/parent/homework/{homeworkId}/complete:
    post:
      tags:
        - ParentPortal
      summary: Đánh dấu con đã làm xong bài
      parameters:
        - in: path
          name: homeworkId
          required: true
          schema:
            type: integer
        - in: query
          name: student_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
    delete:
      tags:
        - ParentPortal
      summary: Bỏ đánh dấu hoàn thành
      parameters:
        - in: path
          name: homeworkId
          required: true
          schema:
            type: integer
        - in: query
          name: student_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /api/v1/parent/homework/{homeworkId}/quiz:
    get:
      tags:
        - ParentPortal
      summary: Lấy đề quiz cho con (ẩn đáp án)
      parameters:
        - in: path
          name: homeworkId
          required: true
          schema:
            type: integer
        - in: query
          name: student_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /api/v1/parent/homework/{homeworkId}/quiz/submit:
    post:
      tags:
        - ParentPortal
      summary: Nộp bài quiz → tự chấm
      parameters:
        - in: path
          name: homeworkId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - student_id
                - answers
              properties:
                student_id:
                  type: integer
                answers:
                  type: array
                  items:
                    type: object
                    required:
                      - question_id
                      - option_id
                    properties:
                      question_id:
                        type: integer
                      option_id:
                        type: integer
      responses:
        '200':
          description: Kết quả chấm
          content:
            application/json:
              schema:
                type: object
                properties:
                  score:
                    type: number
                    example: 8
                  max_score:
                    type: number
                    example: 10
                  attempt_id:
                    type: integer
                  attempt_no:
                    type: integer
                    example: 1
  /api/v1/parent/homework/{homeworkId}/quiz/attempts:
    get:
      tags:
        - ParentPortal
      summary: Lịch sử làm bài của con
      parameters:
        - in: path
          name: homeworkId
          required: true
          schema:
            type: integer
        - in: query
          name: student_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /api/v1/parent/quiz/attempts/{attemptId}/review:
    get:
      tags:
        - ParentPortal
      summary: Xem lại chi tiết 1 lượt làm (đúng/sai từng câu; câu essay kèm essay_score đã chấm tay)
      parameters:
        - in: path
          name: attemptId
          required: true
          schema:
            type: integer
        - in: query
          name: student_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /api/v1/parent/homework/{homeworkId}/submit:
    post:
      tags:
        - ParentPortal
      summary: Nộp bài tập (ảnh/file + ghi chú)
      parameters:
        - in: path
          name: homeworkId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                student_id:
                  type: integer
                note:
                  type: string
                  maxLength: 1000
                file:
                  type: string
                  format: binary
                  description: 'Tối đa 10MB: ảnh/PDF/Word/MP3/MP4'
      responses:
        '200':
          description: OK
        '413':
          description: File vượt quá 10MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/parent/homework/{homeworkId}/submissions:
    get:
      tags:
        - ParentPortal
      summary: Bài đã nộp của con
      parameters:
        - in: path
          name: homeworkId
          required: true
          schema:
            type: integer
        - in: query
          name: student_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
