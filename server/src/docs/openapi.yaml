                  type: integer
                role_id:
                  type: integer
      responses:
        '200':
          description: OK
    delete:
      tags:
        - Roles
      summary: Gỡ role khỏi user
      responses:
        '200':
          description: OK

  # ------------------------- Parent auth bổ sung -------------------------
  /api/v1/parent/refresh:
    post:
      tags:
        - Parent
      summary: Đổi parent refresh token (rotation)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token pair mới
        '401':
          description: Refresh token không hợp lệ
  /api/v1/parent/change-password:
    post:
      tags:
        - Parent
      summary: Đổi mật khẩu phụ huynh (giữ session hiện tại)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Đổi mật khẩu thành công
        '400':
          description: Mật khẩu cũ sai hoặc mật khẩu mới không hợp lệ
  /api/v1/parent/logout-all:
    post:
      tags:
        - Parent
      summary: Đăng xuất mọi thiết bị của phụ huynh
      responses:
        '200':
          description: Đã thu hồi mọi session
  /api/v1/parent/logout:
    post:
      tags:
        - Parent
      summary: Thu hồi parent refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: OK

  # ------------------------- VNPay callback -------------------------
  /api/v1/payments/vnpay-return:
    get:
      tags:
        - Parent
      summary: VNPay return URL (idempotent)
      security: []
      responses:
        '302':
          description: Redirect về portal phụ huynh
  /api/v1/payments/vnpay-ipn:
    post:
      tags:
        - Parent
      summary: VNPay IPN (idempotent, verify checksum)
      security: []
      responses:
        '200':
          description: OK

  # ------------------------- Metrics -------------------------
  /api/v1/metrics:
    get:
      tags:
        - System
      summary: Prometheus metrics
      responses:
        '200':
          description: text/plain; version=0.0.4
  /api/v1/uploads:
    post:
      tags:
        - Homework
      summary: Giáo viên tải file đính kèm lên (chưa gắn vào bài nào)
      description: |
        Nhận multipart/form-data (field "file"): ảnh, PDF, Word, MP3, MP4, tối đa 10MB.
        Kiểm tra magic bytes sau khi ghi đĩa. Trả về URL /uploads/... để client gắn
        vào attachments khi tạo/sửa bài tập. Rate limit: 30 lượt / 15 phút / tài khoản.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Tải lên thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: /uploads/hw_1728_ab12cd.jpg
                  name:
                    type: string
                    example: bai-nghe.mp3
                  size:
                    type: integer
                    example: 524288
        '400':
          description: Sai định dạng / magic bytes không khớp
        '401':
          description: Chưa đăng nhập
        '403':
          description: Không có quyền homework.create
        '413':
          description: File vượt quá 10MB
  /api/v1/uploads/{filename}:
    delete:
      tags:
        - Homework
      summary: Xóa file đã upload nhưng chưa dùng (dọn file mồ côi)
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
          description: 'Tên file do server sinh (vd: hw_<uuid>.png)'
      responses:
        '200':
          description: Đã xóa
        '400':
          description: Tên file không hợp lệ
        '401':
          description: Chưa đăng nhập
        '403':
          description: Không có quyền homework.create
