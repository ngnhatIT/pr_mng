      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /api/v1/parent/leaves:
    get:
      tags:
        - ParentPortal
      summary: Đơn xin nghỉ của con
      responses:
        '200':
          description: OK
    post:
      tags:
        - ParentPortal
      summary: Gửi đơn xin nghỉ
