      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kind
              properties:
                kind:
                  type: string
                  enum: [staff, parent]
                username:
                  type: string
                  description: Bắt buộc khi kind=staff
                phone:
                  type: string
                  description: Bắt buộc khi kind=parent
      responses:
        '200':
          description: Luôn trả ok (không tiết lộ tài khoản có tồn tại hay không)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
