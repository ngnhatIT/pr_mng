openapi: 3.0.3
info:
  title: EduCenterPro API
  description: 'Tài liệu API đầy đủ cho EduCenterPro — nền tảng quản lý trung tâm ngoại ngữ.


    Gồm: Auth, Học viên, Giáo viên, Lớp học, Buổi học & Điểm danh, Học phí & Công nợ, Bài tập & Quiz, Sổ điểm, Phòng học,
    Lương, Học thử, Leads CRM, Referral, Reviews, Zalo OA, Cổng phụ huynh, Cổng giáo viên, Public landing.


    Tất cả endpoint staff đều yêu cầu JWT (đăng nhập admin/staff/teacher).

    Base path chính: /api/v1 (alias legacy /api vẫn hoạt động nhưng deprecated).'
  version: 1.0.0
security:
  - bearerAuth: []
servers:
  - url: http://localhost:4000
    description: Dev server
  - url: /
    description: Production (cùng origin)
security:
  - bearerAuth: []
tags:
  - name: Homework
    description: CRUD bài tập, đăng/gỡ đăng, tái sử dụng
  - name: Quiz
    description: Quiz builder, đề thi, lịch sử làm bài
  - name: Scores
    description: Chấm điểm, bảng điểm
  - name: Bank
    description: Ngân hàng câu hỏi dùng chung
  - name: Rubrics
    description: Rubric chấm điểm tái sử dụng
  - name: Submissions
    description: Bài nộp của học viên
  - name: Auth
    description: Đăng nhập, JWT
  - name: Students
    description: Quản lý học viên
  - name: Teachers
    description: Quản lý giáo viên
  - name: Classes
    description: Quản lý lớp học, xếp lớp
  - name: Sessions
    description: Buổi học, điểm danh, check-in
  - name: Invoices
    description: Hóa đơn học phí, công nợ
  - name: Payments
    description: Duyệt thanh toán, cấu hình VietQR/VNPay
  - name: Dashboard
    description: Số liệu tổng quan
  - name: Zalo
    description: Zalo OA, nhắc học phí
  - name: Leaves
    description: Đơn xin nghỉ
  - name: Grades
    description: Sổ điểm điện tử
  - name: Rooms
    description: Phòng học
  - name: Payroll
    description: Lương giáo viên
  - name: Trials
    description: Học thử
  - name: TeacherPortal
    description: Cổng giáo viên
  - name: Leads
    description: Mini-CRM khách hàng tiềm năng
  - name: Referrals
    description: Giới thiệu, credit
  - name: Reviews
    description: Đánh giá phụ huynh
  - name: Centers
    description: Quản trị đa trung tâm (superadmin)
  - name: AuditLogs
    description: Nhật ký hoạt động
  - name: ParentPortal
    description: Cổng phụ huynh (SĐT + mật khẩu)
  - name: Public
    description: API công khai cho landing page
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Đăng nhập POST /api/auth/login để lấy token
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Không tìm thấy bài tập
        code:
          type: string
          example: NOT_FOUND
    Homework:
      type: object
      properties:
        id:
          type: integer
          example: 12
        class_id:
          type: integer
          example: 3
        class_name:
          type: string
          example: IELTS 6.5 - Tối 2/4/6
        center_id:
          type: integer
          nullable: true
          example: 1
        title:
          type: string
          example: 'Bài tập Unit 5: Thì hiện tại hoàn thành'
        content:
          type: string
          nullable: true
        due_date:
          type: string
          nullable: true
          example: '2026-10-15'
        created_at:
          type: string
          example: '2026-10-09 08:00:00'
        status:
          type: string
          enum:
            - draft
            - scheduled
            - published
          example: published
        publish_at:
          type: string
          nullable: true
          description: Giờ VN YYYY-MM-DDTHH:mm
          example: 2026-10-10T08:00
        max_score:
          type: number
          nullable: true
          example: 10
        close_date:
          type: string
          nullable: true
          example: '2026-10-20'
        kind:
          type: string
          enum:
            - homework
            - quiz
          example: homework
        rubric_id:
          type: integer
          nullable: true
        completed_count:
          type: integer
          example: 18
        student_count:
          type: integer
          example: 25
        question_count:
          type: integer
          example: 0
        attachments:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              url:
                type: string
              kind:
                type: string
                enum:
                  - link
                  - file
    HomeworkCreate:
      type: object
      required:
        - class_ids
        - title
      properties:
        class_ids:
          type: array
          items:
            type: integer
          example:
            - 3
            - 5
          description: Giao 1 lần cho nhiều lớp
        title:
          type: string
          maxLength: 200
          example: Bài tập Unit 5
        content:
          type: string
          maxLength: 5000
        due_date:
          type: string
          example: '2026-10-15'
          description: YYYY-MM-DD
        status:
          type: string
          enum:
            - draft
            - scheduled
            - published
          default: published
        publish_at:
          type: string
          example: 2026-10-10T08:00
          description: Bắt buộc khi status=scheduled (giờ VN)
        max_score:
          type: number
          example: 10
          description: Bỏ qua với quiz (tự tính từ câu hỏi)
        close_date:
          type: string
          example: '2026-10-20'
          description: Phải sau due_date
        kind:
          type: string
          enum:
            - homework
            - quiz
          default: homework
        rubric_id:
          type: integer
          nullable: true
        attachments:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              url:
                type: string
              kind:
                type: string
                enum:
                  - link
                  - file
        target_student_ids:
          type: array
          items:
            type: integer
          description: Giao riêng từng em (rỗng = cả lớp)
        questions:
          $ref: '#/components/schemas/QuizQuestionInput'
          description: Bắt buộc ≥1 câu khi kind=quiz
    QuizQuestionInput:
      type: array
      items:
        type: object
        required:
          - question
          - options
        properties:
          question:
            type: string
            example: She ___ in Hanoi since 2020.
          points:
            type: number
            default: 1
            example: 2
          options:
            type: array
            minItems: 2
            items:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  example: has lived
                is_correct:
                  type: boolean
                  example: true
    QuizQuestionStaff:
      type: object
      properties:
        id:
          type: integer
        question:
          type: string
        points:
          type: number
        options:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              text:
                type: string
              is_correct:
                type: boolean
    QuizAttemptRow:
      type: object
      properties:
        id:
          type: integer
        student_id:
          type: integer
        student_name:
          type: string
        score:
          type: number
        max_score:
          type: number
        submitted_at:
          type: string
    ScoreRow:
      type: object
      properties:
        student_id:
          type: integer
        student_name:
          type: string
        score:
          type: number
          nullable: true
        feedback:
          type: string
          nullable: true
        graded_at:
          type: string
          nullable: true
        completed:
          type: integer
          enum:
            - 0
            - 1
        quiz_score:
          type: number
          nullable: true
          description: Điểm quiz tự chấm cao nhất
    BankQuestion:
      type: object
      properties:
        id:
          type: integer
        tag:
          type: string
          nullable: true
          example: Grammar - Tenses
        question:
          type: string
        points:
          type: number
        options:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              text:
                type: string
              is_correct:
                type: boolean
    Submission:
      type: object
      properties:
        id:
          type: integer
        homework_id:
          type: integer
        student_id:
          type: integer
        student_name:
          type: string
        file_url:
          type: string
          nullable: true
          example: /uploads/hw_1728_ab12cd.jpg
        file_name:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        submitted_at:
          type: string
    PaginatedHomework:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Homework'
        pagination:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 20
            total:
              type: integer
              example: 45
            totalPages:
              type: integer
              example: 3
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 125
        totalPages:
          type: integer
          example: 7
    PaginatedStudents:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        pagination:
          $ref: '#/components/schemas/Pagination'
    ParentAuth:
      type: object
      properties:
        token:
          type: string
          description: JWT phụ huynh (sống ACCESS_TOKEN_TTL)
        refresh_token:
          type: string
          description: Refresh token (opaque, rotation)
        expires_in:
          type: integer
          description: Thời gian sống access token (giây)
        parent:
          type: object
          properties:
            id:
              type: integer
            phone:
              type: string
            name:
              type: string
            referral_code:
              type: string
              nullable: true
            center_id:
              type: integer
              nullable: true
paths:
  /api/v1/client-errors:
    post:
      tags:
        - System
      summary: Nhận log lỗi crash từ client (ErrorBoundary)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                message:
                  type: string
                stack:
                  type: string
                url:
                  type: string
      responses:
        '200':
          description: Đã nhận log
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request_id:
                    type: string
  /api/v1/homework:
    get:
      tags:
        - Homework
      summary: Danh sách bài tập (có filter + phân trang)
      parameters:
        - in: query
          name: class_id
          schema:
            type: string
          description: Lọc theo lớp
        - in: query
          name: search
          schema:
            type: string
          description: Tìm theo tiêu đề/nội dung
        - in: query
          name: due
          schema:
            type: string
            enum:
              - upcoming
              - overdue
              - nodate
        - in: query
          name: status
          schema:
            type: string
            enum:
              - draft
              - scheduled
              - published
        - in: query
          name: kind
          schema:
            type: string
            enum:
              - homework
              - quiz
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHomework'
        '401':
          description: Chưa đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Homework
      summary: Tạo bài tập (1 lần cho nhiều lớp, hỗ trợ nháp/hẹn giờ/quiz)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeworkCreate'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: array
                    items:
                      $ref: '#/components/schemas/Homework'
                  count:
                    type: integer
                    example: 2
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/homework/stats:
    get:
      tags:
        - Homework
      summary: Thống kê nhanh (đã đăng / sắp hết hạn / quá hạn / nháp)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 12
                  dueSoon:
                    type: integer
                    example: 3
                  overdue:
                    type: integer
                    example: 1
                  drafts:
                    type: integer
                    example: 2
  /api/v1/homework/analytics:
    get:
      tags:
        - Homework
      summary: Phân tích hoàn thành & điểm TB theo lớp
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  byClass:
                    type: array
                    items:
                      type: object
                      properties:
                        class_id:
                          type: integer
                        class_name:
                          type: string
                        total:
                          type: integer
                        avg_completion:
                          type: number
                          example: 0.72
                        avg_score:
                          type: number
                          nullable: true
                          example: 7.5
                  recent:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        class_name:
                          type: string
                        completion_rate:
                          type: number
                          example: 80
  /api/v1/homework/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      tags:
        - Homework
      summary: Chi tiết bài tập (kèm đính kèm)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Homework'
        '404':
          description: Không tìm thấy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Homework
      summary: Cập nhật bài tập (title, nội dung, hạn, điểm, trạng thái...)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                content:
                  type: string
                  maxLength: 5000
                due_date:
                  type: string
                  nullable: true
                  example: '2026-10-15'
                max_score:
                  type: number
                  nullable: true
                close_date:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum:
                    - draft
                    - scheduled
                    - published
                publish_at:
                  type: string
                  nullable: true
                rubric_id:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Homework'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Homework
      summary: Xóa bài tập (cascade quiz/điểm/bài nộp/đính kèm)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '404':
          description: Không tìm thấy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/homework/{id}/reuse:
    post:
      tags:
        - Homework
      summary: Tái sử dụng — copy thành bài nháp mới (giữ nguyên targets giao riêng)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Đã tạo bản copy
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    $ref: '#/components/schemas/Homework'
                  count:
                    type: integer
                    example: 1
  /api/v1/homework/{id}/publish:
    post:
      tags:
        - Homework
      summary: Đăng ngay (từ nháp/hẹn giờ) + gửi Zalo cho phụ huynh
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
  /api/v1/homework/{id}/unpublish:
    post:
      tags:
        - Homework
      summary: Gỡ đăng về nháp (thu hồi khi đăng nhầm)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
  /api/v1/homework/{id}/scores:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      tags:
        - Scores
      summary: Bảng điểm của bài tập (từng học viên + điểm quiz)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoreRow'
    post:
      tags:
        - Scores
      summary: Chấm điểm 1 học viên (chặn điểm > max_score)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - student_id
              properties:
                student_id:
                  type: integer
                  example: 42
                score:
                  type: number
                  nullable: true
                  example: 8.5
                feedback:
                  type: string
                  maxLength: 2000
                  example: Làm tốt, chú ý câu 3
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        '400':
          description: Điểm không hợp lệ / vượt max
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/homework/{id}/quiz/edit:
    get:
      tags:
        - Quiz
      summary: Lấy đề quiz đầy đủ kèm đáp án đúng (staff sửa đề)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuizQuestionStaff'
  /api/v1/homework/{id}/quiz:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    put:
      tags:
        - Quiz
      summary: Lưu bộ câu hỏi quiz (chặn nếu đã có học viên làm bài)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - questions
              properties:
                questions:
                  $ref: '#/components/schemas/QuizQuestionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 10
        '400':
          description: Đã có lượt làm / dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/homework/{id}/quiz/attempts:
    get:
      tags:
        - Quiz
      summary: Lịch sử làm quiz của cả lớp
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuizAttemptRow'
  /api/v1/homework/{id}/quiz/essay:
    get:
      tags:
        - Quiz
      summary: YC2 — câu essay của quiz + rubric gắn kèm (để màn chấm hiện/ẩn nút chấm)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  essay_questions:
                    type: array
                    items:
                      type: object
                  rubric:
                    type: object
                    nullable: true
  /api/v1/homework/{id}/quiz/essay/{studentId}:
    get:
      tags:
        - Quiz
      summary: YC2 — dữ liệu form chấm tự luận của 1 học viên
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: studentId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '400':
          description: Quiz chưa gắn rubric / học viên không thuộc lớp
  /api/v1/homework/{id}/quiz/essay/grade:
    post:
      tags:
        - Quiz
      summary: YC2 — chấm 1 câu tự luận theo tiêu chí rubric (idempotent)
      parameters:
        - in: path
