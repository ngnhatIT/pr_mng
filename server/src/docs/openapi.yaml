      responses:
        '200':
          description: OK
    post:
      tags:
        - Roles
      summary: Tạo vai trò tùy chỉnh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Đã tạo
  /api/v1/roles/permissions:
    get:
      tags:
        - Roles
      summary: Catalog 61 permissions
      responses:
        '200':
          description: OK
  /api/v1/roles/me/permissions:
    get:
      tags:
        - Roles
      summary: Permissions của user hiện tại (menu gating)
      responses:
        '200':
          description: OK
  /api/v1/roles/users:
    get:
      tags:
        - Roles
      summary: Nhân sự có thể gán custom role (roles.manage, trong trung tâm)
      responses:
        '200':
          description: OK
  /api/v1/roles/{id}:
    get:
      tags:
        - Roles
      summary: Chi tiết vai trò (permissions + users đang có vai trò)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '404':
          description: Không tìm thấy
    put:
      tags:
        - Roles
      summary: Cập nhật vai trò tùy chỉnh
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
    delete:
      tags:
        - Roles
      summary: Xóa vai trò tùy chỉnh
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /api/v1/roles/{id}/permissions:
    put:
      tags:
        - Roles
      summary: Gán permissions cho role (thay thế toàn bộ)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
