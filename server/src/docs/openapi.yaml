  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Đăng nhập (staff/admin/teacher/root)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: 'JWT, dùng cho header Authorization: Bearer <token>'
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      role:
                        type: string
                        enum:
                          - superadmin
                          - admin
                          - staff
                          - teacher
                          - parent
                      name:
                        type: string
                      center_id:
                        type: integer
                        nullable: true
        '401':
          description: Sai tài khoản/mật khẩu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quá nhiều lần thử (rate limit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: Đổi refresh token lấy cặp token mới (rotation)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: OK — cặp token mới, token cũ bị revoke
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT access token mới (sống ACCESS_TOKEN_TTL)
                  refresh_token:
                    type: string
                    description: Refresh token mới (token cũ đã bị revoke)
                  expires_in:
                    type: integer
                    description: Thời gian sống access token (giây)
        '401':
          description: Refresh token không hợp lệ / hết hạn / bị thu hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Đăng xuất — thu hồi refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /api/v1/auth/logout-all:
    post:
