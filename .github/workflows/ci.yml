name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Hủy run cũ khi push mới (tiết kiệm runner cho loop audit-fix push liên tiếp)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Unit tests (server)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: educenter
          # Mật khẩu dùng một lần cho database test trên CI (container tạm, xóa sau mỗi job)
          POSTGRES_PASSWORD: educenter_ci_test
          POSTGRES_DB: educenter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://educenter:educenter_ci_test@localhost:5432/educenter_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -w server
      - run: npm test -w client
      - run: python3 -c "import yaml; yaml.safe_load(open('server/src/docs/openapi.yaml')); print('openapi.yaml valid')"

  build:
    name: Build (server + client)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke test build artifact
        run: |
          timeout 30 node server/dist/index.js &
          sleep 5
          curl -f http://localhost:3001/api/live || (echo "Smoke test failed" && exit 1)
          kill %1
